<text x="1014" y="558" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#3fd0c9">SECONDARY  ·  corroborates, never leads  ·  forehead β is part muscle</text>

