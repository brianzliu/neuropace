<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEG calibration</title><style>body{font:20px system-ui;background:#f7f6ef;color:#263b31;max-width:900px;margin:35px auto;padding:0 25px;text-align:center}h1{font-size:25px}#instruction{font-size:31px;line-height:1.4;min-height:100px}#dot{width:24px;height:24px;border-radius:50%;background:#263b31;margin:70px auto}#count{font-size:35px;font-variant-numeric:tabular-nums;height:50px}#status{font-size:16px;color:#637366}button{font:inherit;padding:12px 20px;border:1px solid #697e71;border-radius:10px;background:white;margin:10px;cursor:pointer}button:disabled{opacity:.4}canvas{width:100%;height:70px;margin-top:20px}#error{color:#ad321c}pre{text-align:left;font-size:14px;white-space:pre-wrap}details{margin-top:20px}[hidden]{display:none!important}</style></head><body><h1>EEG calibration</h1><p id="status">No active recording</p><p id="instruction">Keep your eyes open and relax. Follow the short spoken cues.</p><div id="dot"></div><div id="count"></div><button id="connect">Connect headset</button><button id="start" hidden disabled>Begin calibration</button><button id="stop" hidden>Stop</button><p id="error"></p><div id="offer" hidden><p>EEG catch-up available (scripted test context)</p><button id="openCatchup">Show catch-up</button></div><p id="catchup" hidden></p><canvas id="trace" width="900" height="70"></canvas><p style="font-size:14px;color:#637366">No lesson. No quiz. Keep your head still and your jaw relaxed.</p><details id="result" hidden><summary>Recorded measurements</summary><pre id="data"></pre></details><script>
const $=id=>document.getElementById(id);let state,currentCard,catchupTimer;
async function post(path){const r=await fetch(path,{method:'POST'});const data=await r.json();if(!r.ok)throw new Error(data.detail||r.status);return data;}
async function update(){try{state=await fetch('/state').then(r=>r.json());$('connect').hidden=state.stage!=='idle';$('start').hidden=state.stage!=='fit';$('start').disabled=!state.fit_ready;$('stop').hidden=!['fit','signal'].includes(state.stage);$('instruction').textContent=state.display.instruction;$('count').textContent=state.stage==='signal'?state.display.remaining+' seconds':'';$('status').textContent=!state.session_id?'Recording stopped':!state.stream_live?'Waiting for headset data':state.focus?.quality==='good'&&!state.focus?.artifact?'Real EEG connected; usable signal':'Real EEG connected; adjust forehead sensor or ear clip';$('error').textContent=state.error||'';if(state.live_check)document.querySelector('h1').textContent='Live focus check';currentCard=state.catchups.find(c=>c.reason==='eeg'&&!state.opened.includes(c.flag_id));$('offer').hidden=!currentCard||state.stage!=='signal';const c=$('trace').getContext('2d'),raw=state.raw||[];c.clearRect(0,0,900,70);if(raw.length){const scale=Math.max(40,...raw.map(Math.abs));c.strokeStyle='#698575';c.beginPath();raw.forEach((v,i)=>{const x=i*900/(raw.length-1||1),y=35-v/scale*30;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();}if(state.result){$('result').hidden=false;$('data').textContent=JSON.stringify(state.result,null,2);}}catch(e){$('error').textContent=e.message;}}
$('openCatchup').onclick=async()=>{if(!currentCard)return;try{const card=await post('/catchup/'+currentCard.flag_id);$('catchup').textContent=card.line;$('catchup').hidden=false;clearTimeout(catchupTimer);catchupTimer=setTimeout(()=>$('catchup').hidden=true,(card.ttl_s||6)*1000)}catch(e){$('error').textContent=e.message}};
$('connect').onclick=()=>post('/fit').catch(e=>$('error').textContent=e.message);$('start').onclick=()=>post('/start').catch(e=>$('error').textContent=e.message);$('stop').onclick=()=>post('/stop').catch(e=>$('error').textContent=e.message);setInterval(update,500);setInterval(()=>{if(['fit','signal'].includes(state?.stage))post('/heartbeat').catch(()=>{})},2000);update();
</script></body></html>
