[project]
name = "reflow"
version = "0.1.0"
description = "Reflow: notices the moment a lecture loses you, catches you up in one glance, and re-teaches what you missed until it lands. HackMIT 2026."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "numpy>=1.26",
  "pyserial>=3.5",
  "openai>=1.66",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "scipy>=1.12",
]

[project.scripts]
reflow = "reflow.cli:main"

[dependency-groups]
monitor = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflow", "mindwave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
# the mindwave pipeline and its tools keep their own style (see AGENTS.md)
exclude = ["mindwave", "monitor.py", "run_pipeline.py", "example_consumer.py", "reflow_eval.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# the spec's own toolkit, kept verbatim so its numbers stay reproducible
"reflow/eval/reflow_eval.py" = ["E701", "E702", "E741", "UP031", "B007"]
"reflow/eval/bandit_sim.py" = ["E701", "E702", "E741", "UP031", "B007"]
"reflow/eval/lossmap_sim.py" = ["E701", "E702", "E741", "UP031", "B007"]
# FastAPI dependency defaults
"reflow/api/routes.py" = ["B008"]
